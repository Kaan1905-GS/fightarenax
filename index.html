<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>FightArenaX</title>
<style>
  :root { color-scheme: dark; --bg: #0e0b24; --card: #1a1640; --line: #3a3470; --ink: #f4f1ff; --dim: #aaa3d8; --gold: #ffd23f; --hot: #ff6a2b; --bad: #ff6b6b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: radial-gradient(ellipse at 50% 0%, #2b1f6b 0%, var(--bg) 60%); color: var(--ink); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: grid; place-items: center; padding: 16px; }
  .box { width: min(400px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 28px 22px; display: grid; gap: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  h1 { margin: 0; font: 900 clamp(38px, 11vw, 52px)/.95 system-ui, sans-serif; letter-spacing: -.02em; font-style: italic; }
  h1 .a { color: var(--gold); } h1 .x { color: #c07bff; }
  p { margin: 0; color: var(--dim); }
  label { display: grid; gap: 6px; font-weight: 700; font-size: 14px; }
  input[type=password] { width: 100%; font: inherit; font-size: 18px; padding: 13px 14px; border-radius: 12px; border: 2px solid var(--line); background: #110e2c; color: var(--ink); }
  input[type=password]:focus { outline: none; border-color: var(--gold); }
  .rem { display: flex; gap: 8px; align-items: center; font-weight: 400; color: var(--dim); }
  .rem input { width: 18px; height: 18px; accent-color: var(--gold); }
  button { font: 800 18px system-ui, sans-serif; padding: 14px; border: 0; border-radius: 12px; background: linear-gradient(90deg, var(--hot), var(--gold)); color: #1a1030; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .msg { min-height: 1.4em; font-size: 14px; color: var(--bad); }
  .msg.ok { color: var(--dim); }
</style>
</head>
<body>
<form class="box" id="f" autocomplete="off">
  <h1>Fight<span class="a">Arena</span><span class="x">X</span></h1>
  <p>Privater Testzugang. Gib das Passwort ein, das du bekommen hast.</p>
  <label>Passwort<input type="password" id="pw" required autocomplete="current-password" enterkeyhint="go"></label>
  <label class="rem"><input type="checkbox" id="rem" checked> Auf diesem Gerät merken</label>
  <button type="submit" id="go">Spielen</button>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>
</form>
<script>
(() => {
  const SALT = 'sziU9l5LkDqbCOtSu0hEnw==', ITER = 210000, VER = '0076564c66';
  const $ = id => document.getElementById(id), msg = $('msg'), btn = $('go');
  const b64 = u => btoa(String.fromCharCode(...new Uint8Array(u)));
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function open(raw, remember) {
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    const r = await fetch('game.enc?v=' + VER, { cache: 'no-cache' }); if (!r.ok) throw new Error('net');
    const all = new Uint8Array(await r.arrayBuffer());
    const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: all.subarray(0, 12) }, key, all.subarray(12)));
    const k = b64(raw);
    try { sessionStorage.setItem('faxk', k); } catch (e) { /* private mode */ }
    try { if (remember) localStorage.setItem('faxk', k); } catch (e) { /* private mode */ }
    document.open(); document.write(html); document.close();
  }
  async function derive(pw) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: unb64(SALT), iterations: ITER, hash: 'SHA-256' }, base, 256);
  }
  if (!window.crypto || !crypto.subtle) { msg.textContent = 'Dein Browser unterstützt die Entschlüsselung nicht. Bitte Safari oder Chrome aktuell verwenden.'; btn.disabled = true; return; }
  // remembered on this device: unlock straight away
  let saved = null; try { saved = localStorage.getItem('faxk'); } catch (e) { saved = null; }
  if (saved) { msg.className = 'msg ok'; msg.textContent = 'Wird geöffnet …'; open(unb64(saved), true).catch(() => { try { localStorage.removeItem('faxk'); } catch (e) { /* ignore */ } msg.className = 'msg'; msg.textContent = ''; }); }
  $('f').addEventListener('submit', async e => {
    e.preventDefault(); btn.disabled = true; msg.className = 'msg ok'; msg.textContent = 'Wird geöffnet …';
    try { await open(await derive($('pw').value), $('rem').checked); }
    catch (err) { btn.disabled = false; msg.className = 'msg'; msg.textContent = err && err.message === 'net' ? 'Keine Verbindung. Bitte später nochmal versuchen.' : 'Falsches Passwort.'; $('pw').select(); }
  });
})();
</script>
</body>
</html>
